<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Masterpiece</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: una colonna centrata — header gara, poi chip disciplina, poi i 4 riquadri della settimana */
.app[data-mm="light"]{
  --bg:#ffffff; --surface:#f7f4f4; --surface-2:#efe9ea; --line:#e6dfe0;
  --text:#161112; --muted:#6d6466; --accent:#d50f25; --accent-ink:#ffffff; --accent-soft:#fbe6e9;
  --hero-bg:#d50f25; --hero-text:#ffffff; --hero-muted:#ffd9de; --planned:#d9d1d2; --body:#e6dcdd; --joint:#f1ebeb; --ol:rgba(70,20,28,.5); --fib:rgba(60,12,22,.26); --heat-lo:#f9cdd5; --heat-hi:#c40d24;
  color-scheme:light;
}
.app[data-mm="dark"]{
  --bg:#0f0c0d; --surface:#1a1617; --surface-2:#241f20; --line:#332c2e;
  --text:#f6f2f2; --muted:#a69d9f; --accent:#ff3048; --accent-ink:#ffffff; --accent-soft:#3a1519;
  --hero-bg:#1a1617; --hero-text:#ffffff; --hero-muted:#c9bfc1; --planned:#4a4245; --body:#3a3133; --joint:#2a2426; --ol:rgba(0,0,0,.65); --fib:rgba(0,0,0,.32); --heat-lo:#7a3440; --heat-hi:#ff3048;
  color-scheme:dark;
}
:root{
  --swim:#1ea7e1; --bike:#22a85a; --run:#e2ad00; --str:#e23f6b;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:#ffffff}
body.dark{background:#0f0c0d}
.app{min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;transition:background .2s,color .2s}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1}
.brand b{font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}
.brand span{font-size:12px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.tools{display:flex;align-items:center;gap:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.seg button{border:0;background:none;color:var(--muted);font:600 13px var(--f-body);padding:7px 13px;border-radius:999px;cursor:pointer;letter-spacing:.06em}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.icon-btn{width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--text);display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:19px;height:19px}
button:focus-visible,.chip:focus-visible,.date-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* hero */
.hero{background:var(--hero-bg);color:var(--hero-text);border-radius:22px;padding:28px clamp(20px,4vw,40px);display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;position:relative;overflow:hidden}
.app[data-mm="dark"] .hero{border:1px solid var(--line);border-top:4px solid var(--accent)}
.hero .eyebrow{font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--hero-muted)}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,7vw,72px);line-height:.92;margin:8px 0 0;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--hero-muted)}
.app[data-mm="dark"] .hero h1 em{color:var(--accent)}
.count{display:flex;gap:28px;align-items:flex-end}
.count .n{font-family:var(--f-display);font-weight:700;font-size:clamp(48px,8vw,84px);line-height:.9;font-variant-numeric:tabular-nums}
.count .l{display:block;font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--hero-muted);margin-top:6px}
.race{grid-column:1/-1;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.28);padding-top:16px}
.race .lbl{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--hero-muted)}
.date-btn{border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);color:var(--hero-text);border-radius:999px;padding:8px 16px;font:600 15px var(--f-body);cursor:pointer;font-variant-numeric:tabular-nums}
.date-btn:hover{background:rgba(255,255,255,.22)}

/* date popover */
.pop{position:absolute;z-index:20;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:14px;width:300px;max-width:calc(100vw - 32px);box-shadow:0 18px 40px rgba(0,0,0,.22)}
.pop-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.pop-head b{font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:.02em}
.pop-head button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--text);cursor:pointer}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.grid7 .dn{font-size:11px;font-weight:600;color:var(--muted);padding:4px 0}
.grid7 button{border:0;background:none;color:var(--text);padding:8px 0;border-radius:9px;cursor:pointer;font:500 14px var(--f-body);font-variant-numeric:tabular-nums}
.grid7 button:hover{background:var(--accent-soft)}
.grid7 button.sel{background:var(--accent);color:var(--accent-ink)}
.grid7 button.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.inf{width:100%;margin-top:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:10px;font:600 14px var(--f-body);cursor:pointer}
.inf.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* week */
.week-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.week-head h2{font-family:var(--f-display);font-weight:700;font-size:28px;margin:0;text-transform:uppercase;letter-spacing:.02em}
.week-head span{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:9px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:9px 16px 9px 13px;font:600 15px var(--f-body);cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.chip i{width:11px;height:11px;border-radius:999px;background:var(--c);opacity:.45}
.chip[aria-pressed="true"]{border-color:var(--c);color:var(--text);background:color-mix(in srgb,var(--c) 14%,var(--bg))}
.chip[aria-pressed="true"] i{opacity:1}
.chip.locked{cursor:default}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.stat .k{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--f-display);font-weight:700;font-size:clamp(40px,5vw,54px);line-height:.95;font-variant-numeric:tabular-nums}
.stat .v small{font-size:.5em;color:var(--muted);font-weight:600;margin-left:2px}
.bar{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar b{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .25s}
.stat.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stat.main .k,.stat.main .v small{color:rgba(255,255,255,.82)}
.stat.main .bar{background:rgba(255,255,255,.3)}
.stat.main .bar b{background:#fff}
.note{font-size:13px;color:var(--muted)}

/* quote */
.quote{margin:0;padding:6px 0 6px 22px;border-left:3px solid var(--accent)}
.quote p{margin:0;font-family:"Times New Roman",Times,"Liberation Serif",serif;font-style:italic;font-size:clamp(18px,2.2vw,22px);line-height:1.45;color:var(--text)}
.quote cite{display:block;margin-top:10px;font-style:normal;font-size:14px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
/* duo */
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:stretch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:24px;text-transform:uppercase;letter-spacing:.02em}
.panel .sub{color:var(--muted);font-size:14px;margin-top:-8px;font-variant-numeric:tabular-nums}
.ses{display:flex;align-items:center;gap:14px;background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:14px;padding:14px 16px}
.ses .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,var(--bg));color:var(--c);flex:none}
.ses .ic svg{width:22px;height:22px}
.ses .tx{flex:1;min-width:0}
.ses .tx b{display:block;font-size:16px}
.ses .tx span{display:block;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.tag{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tag.done{background:color-mix(in srgb,#22a85a 18%,var(--bg));color:#22a85a}
.tag.skip{background:var(--accent-soft);color:var(--accent)}
.rest{flex:1;display:grid;place-items:center;text-align:center;color:var(--muted);font-family:var(--f-display);font-size:26px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border:1px dashed var(--line);border-radius:14px;padding:30px 10px}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:18px;justify-content:center;font-size:14px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* menu */
.lead{display:flex;align-items:center;gap:14px}
.burger{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);display:grid;place-items:center;cursor:pointer;flex:none}
.burger svg{width:20px;height:20px}
.scrim{position:fixed;inset:0;background:rgba(10,6,7,.48);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{box-sizing:border-box;position:fixed;top:0;bottom:0;left:0;width:25%;min-width:260px;background:var(--bg);border-right:1px solid var(--line);z-index:50;transform:translateX(-102%);transition:transform .22s ease;display:flex;flex-direction:column;gap:6px;
  padding:calc(20px + env(safe-area-inset-top,0px)) 16px 20px max(16px,env(safe-area-inset-left,0px));visibility:hidden}
.drawer.on{transform:none;visibility:visible;box-shadow:12px 0 40px rgba(0,0,0,.18)}
.drawer .lead{margin-bottom:22px}
.nav-item{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:var(--text);font:600 18px var(--f-body);padding:14px 16px;border-radius:12px;cursor:pointer;text-align:left}
.nav-item:hover{background:var(--surface)}
.nav-item[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.nav-item svg{width:20px;height:20px;flex:none}
/* calendar */
.cal-title{font-family:var(--f-display);font-weight:800;font-size:clamp(36px,5vw,52px);text-transform:uppercase;margin:0;line-height:1}
.cal-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cal-bar .seg button{font-size:14px;padding:8px 14px}
.navp{display:flex;align-items:center;gap:6px}
.navp button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;font-size:18px}
.navp b{min-width:190px;text-align:center;font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:9px 16px;font:600 14px var(--f-body);cursor:pointer}
.btn.acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.day{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 10px 18px;min-height:300px;display:flex;flex-direction:column;gap:8px;min-width:0}
.day.today{box-shadow:inset 0 0 0 2px var(--accent)}
.day-h{display:flex;flex-direction:column;line-height:1.1}
.day-h span{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.day-h b{font-family:var(--f-display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.day.today .day-h span,.day.today .day-h b{color:var(--accent)}
.card{border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 13%,var(--bg));border-radius:10px;padding:8px 10px;min-width:0}
.card b{display:block;font-size:14px;line-height:1.25;overflow-wrap:anywhere}
.card span{display:block;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.day{cursor:pointer}
.day.sel{background:color-mix(in srgb,var(--accent) 7%,var(--surface));border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.list{position:relative;display:flex;flex-direction:column;gap:10px;flex:1;min-height:40px}
.cw{position:relative}
.card{cursor:grab;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:pan-y}
.card.dragging{opacity:.35}
.card.lifted{box-shadow:0 10px 26px rgba(0,0,0,.25);transform:scale(1.03);position:relative;z-index:4}
.ins{position:absolute;left:50%;width:26px;height:26px;margin-left:-13px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);font:700 18px/26px var(--f-body);padding:0;cursor:pointer;z-index:3;box-shadow:0 2px 8px rgba(0,0,0,.25);display:none}
.day.sel .ins{display:block}
.ins.top{top:-13px}.ins.mid{bottom:-18px}.ins.bot{bottom:-13px}
.ins.only{top:50%;margin-top:-13px}
.ind{position:absolute;left:0;right:0;height:3px;margin-top:-1.5px;border-radius:3px;background:var(--accent);pointer-events:none;z-index:5;display:none}
.ind.on{display:block}
.mhead,.mrow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.mhead span{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center;padding-bottom:4px}
.mgrid{display:flex;flex-direction:column;gap:6px}
.mrow{border-radius:14px;padding:3px;transition:background .12s}
.mday{border:1px solid var(--line);background:var(--surface);border-radius:11px;min-height:88px;padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left;color:var(--text);font:inherit;min-width:0}
.mday.out{opacity:.4}
.mday.today{box-shadow:inset 0 0 0 2px var(--accent)}
.mday b{font-size:15px;font-variant-numeric:tabular-nums}
.mday.today b{color:var(--accent)}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:999px;background:var(--c)}
@media (hover:hover){.mrow:hover{background:var(--accent-soft)}.mrow:hover .mday{border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}}
.yr{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.ym{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;cursor:pointer;text-align:left;color:var(--text);font:inherit;display:flex;flex-direction:column;gap:8px}
.ym:hover{border-color:var(--accent)}
.ym h4{margin:0;font-family:var(--f-display);font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.ym.cur h4{color:var(--accent)}
.ym .g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:11px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.ym .g .td{background:var(--accent);color:var(--accent-ink);border-radius:5px}
.ym .g .has{color:var(--text);font-weight:700}
/* modal */
.mod{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));background:rgba(10,6,7,.55)}
.mod[hidden]{display:none!important}
.box{box-sizing:border-box;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:20px;padding:22px;width:min(520px,100%);box-shadow:0 24px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:16px}
.box-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.box-h h3{margin:0;font-family:var(--f-display);font-size:28px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;line-height:1.05}
.box-h p{margin:4px 0 0;color:var(--muted);font-size:14px}
.x{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;font-size:20px;line-height:1;flex:none}
.pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pick button{border:1.5px solid var(--c);background:color-mix(in srgb,var(--c) 12%,var(--bg));color:var(--text);border-radius:16px;padding:22px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:10px;font:700 18px var(--f-body)}
.pick button:hover{background:color-mix(in srgb,var(--c) 22%,var(--bg))}
.pick svg{width:40px;height:40px;color:var(--c)}
.box.wide{width:min(680px,100%);max-height:calc(100vh - 40px);overflow:auto}
.fld{display:flex;flex-direction:column;gap:6px}
.fld>span{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.inp{box-sizing:border-box;width:100%;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:10px 12px;font:500 16px var(--f-body);min-width:0}
.inp:focus{outline:2px solid var(--accent);outline-offset:-1px}
.exs{display:flex;flex-direction:column;gap:12px}
.ex{border:1px solid var(--line);border-left:4px solid var(--str);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.ex-h{display:flex;gap:8px;align-items:center}
.ex-h .inp{font-weight:700}
.ex-h b{flex:1;font-size:16px}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:62px minmax(0,1fr) minmax(0,1fr) 34px;gap:8px;align-items:center}
.set>span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.set .inp{padding:8px 10px;text-align:center;font-variant-numeric:tabular-nums;background:var(--bg)}
.set-h{display:grid;grid-template-columns:62px minmax(0,1fr) minmax(0,1fr) 34px;gap:8px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center}
.set-h span:first-child{text-align:left}
.prev{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.mini{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:0}
.mini:hover{color:var(--accent);border-color:var(--accent)}
.lnk{align-self:flex-start;border:0;background:none;color:var(--accent);font:600 14px var(--f-body);cursor:pointer;padding:4px 0}
.acts{display:flex;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
.acts .sp{flex:1}
.btn.ghost{background:none}
.btn.dang{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:none}
.tg{align-self:flex-start;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.tg.done{background:color-mix(in srgb,#22a85a 18%,var(--bg));color:#22a85a}
.tg.skip{background:var(--accent-soft);color:var(--accent)}

  function renderAna(){
    var R=anaRange(),el=document.getElementById('ana-body');
    var perO=[['all','pAll'],['4','p4'],['8','p8'],['12','p12']],resO=[['w','rW'],['d','rD']].concat(A.per==='all'?[['p','rP']]:[]);
    if(A.per!=='all'&&A.res==='p')A.res='w';
    var sel=function(id,o,v){return '<select class="inp asel" id="'+id+'">'+o.map(function(q){return '<option value="'+q[0]+'"'+(q[0]===v?' selected':'')+'>'+t(q[1])+'</option>'}).join('')+'</select>'};
    document.getElementById('ana-filter').innerHTML=sel('a-per',perO,A.per)+sel('a-res',resO,A.res)+(A.per==='all'&&A.res==='p'?'<select class="inp asel" id="a-ph"><option>'+t('noPh')+'</option></select>':'');
    if(R.empty){el.innerHTML='<div class="panel"><div class="ph">'+t('noPhTxt')+'</div></div>';ANA_ST=null;return}
    var tChips=END4.map(function(k){return '<button type="button" class="chip" data-avt="'+k+'" aria-pressed="'+(A.hide.indexOf(k)<0)+'" style="--c:var('+COL[k]+')"><i></i>'+t(k)+'</button>'}).join('');
    var dChips=['run','bike','swim'].map(function(k){return '<button type="button" class="chip" data-avd="'+k+'" aria-pressed="'+(A.dsp===k)+'" style="--c:var('+COL[k]+')"><i></i>'+t(k)+'</button>'}).join('');
    var axis='<div class="note">'+t('axis')+': '+t(R.res==='d'?'rD':'rW')+'</div>';
    var h='<section class="panel"><h3>'+t('charts')+'</h3>'+
      '<div class="vol"><h4>'+t('volT')+'</h4><div class="chips sm">'+tChips+'<span class="note">● - - '+t('pl')+'</span></div>'+volChart('t',R)+axis+'</div>'+
      '<div class="vol"><h4>'+t('volD')+'</h4><div class="chips sm">'+dChips+'<span class="note">● - - '+t('pl')+'</span></div>'+volChart('d',R)+axis+'</div></section>';
    var dsc=['str','swim','bike','run'].map(function(k){return '<button type="button" class="chip" data-adisc="'+k+'" aria-pressed="'+(A.disc===k)+'" style="--c:var('+COL[k]+')"><i></i>'+t(k)+'</button>'}).join('');
    h+='<section class="panel"><h3>'+t('byDisc')+'</h3><div class="chips">'+dsc+'</div>';
    ANA_ST=null;
    if(A.disc!=='str')h+='<div class="ph">'+t('comingSoon')+'</div>';
    else{var st=strStats(R);ANA_ST=st;
      h+='<div class="figs" id="figs"><figure class="figbox">'+figSVG('front',st)+'<figcaption>'+t('front')+'</figcaption></figure><figure class="figbox">'+figSVG('back',st)+'<figcaption>'+t('back')+'</figcaption></figure><div class="tip" id="tip" hidden></div></div>'+
        '<div class="scale"><span>0</span><i></i><span>'+t('maxSets')+'</span></div>'+
        '<div class="mpanel'+(A.sel?' on':'')+'" id="mpanel">'+(A.sel?mpanelHTML(st):'')+'</div>'}
    h+='</section>';el.innerHTML=h}
  var ANA_ST=null;
  function mpanelHTML(st){var m=A.sel,list=st.ex[m]?Object.keys(st.ex[m]).map(function(k){return st.ex[m][k]}).sort(function(a,b){return b.sets-a.sets||b.pr-a.pr}):[];
    var h='<div class="box-h"><div><h3>'+MUS[m][state.lang==='en'?1:0]+'</h3><p>'+st.per[m]+' '+t('setsDone').toLowerCase()+'</p></div><button type="button" class="x" data-mclose="1" aria-label="'+t('close')+'">×</button></div>';
    if(!list.length)return h+'<div class="ph">'+t('noExP')+'</div>';
    return h+'<table class="mt"><thead><tr><th>'+t('exName')+'</th><th>'+t('setsDone')+'</th><th>PR</th></tr></thead><tbody>'+list.map(function(o){return '<tr><td>'+esc(o.name)+'</td><td>'+o.sets+'</td><td>'+(o.pr?(+o.pr.toFixed(1))+' kg':'—')+'</td></tr>'}).join('')+'</tbody></table>'}
  function selMuscle(m){A.sel=A.sel===m?null:m;var p=document.getElementById('mpanel');if(!p||!ANA_ST)return;
    p.classList.toggle('on',!!A.sel);p.innerHTML=A.sel?mpanelHTML(ANA_ST):'';
    document.querySelectorAll('#figs .mus').forEach(function(g){g.classList.toggle('on',g.dataset.m===A.sel)});
    if(A.sel){var r=p.getBoundingClientRect();if(r.top<0||r.bottom>window.innerHeight)p.scrollIntoView({behavior:'smooth',block:'nearest'})}}

  document.addEventListener('mousemove',function(e){var tip=document.getElementById('tip');if(!tip)return;var g=e.target.closest&&e.target.closest('#figs .mus');
    if(!g||!ANA_ST){tip.hidden=true;return}var fr=document.getElementById('figs').getBoundingClientRect();tip.hidden=false;
    tip.textContent=MUS[g.dataset.m][state.lang==='en'?1:0]+' · '+ANA_ST.per[g.dataset.m]+' '+t('sets');tip.style.left=(e.clientX-fr.left+12)+'px';tip.style.top=(e.clientY-fr.top+12)+'px'});
  document.addEventListener('click',function(e){
    var x=e.target.closest&&e.target.closest('[data-avt],[data-avd],[data-adisc],[data-mclose]');
    if(x){if(x.dataset.avt){var k=x.dataset.avt,on=END4.filter(function(q){return A.hide.indexOf(q)<0});if(A.hide.indexOf(k)<0){if(on.length>1)A.hide.push(k)}else A.hide=A.hide.filter(function(q){return q!==k});renderAna()}
      else if(x.dataset.avd){A.dsp=x.dataset.avd;renderAna()}else if(x.dataset.adisc){A.disc=x.dataset.adisc;A.sel=null;renderAna()}else if(x.dataset.mclose){selMuscle(A.sel)}return}
    if(state.sec!=='a')return;
    var g=e.target.closest&&e.target.closest('#figs .mus');if(g){selMuscle(g.dataset.m);return}
    if(A.sel&&!(e.target.closest&&e.target.closest('#mpanel,#ana-filter')))selMuscle(A.sel)});
  document.addEventListener('change',function(e){var id=e.target.id;if(id==='a-per'){A.per=e.target.value;if(A.per!=='all'&&A.res==='p')A.res='w';renderAna()}else if(id==='a-res'){A.res=e.target.value;renderAna()}});

  function renderAll(){renderStatic();renderCount();renderQuote();renderChips();renderStats();renderToday();renderLoad();renderNav();if(state.sec==='c')renderCal();if(state.sec==='a')renderAna();if(!document.getElementById('mod').hidden){state.addDate?closeMod():0}}

  /* date popover with ∞ option */
  var pop=null,view=null;
  function closePop(){if(pop){pop.remove();pop=null}}
  function openPop(btn){
    closePop();
    var base=isDate(state.race)?pd(state.race):new Date();
    view={y:base.getFullYear(),m:base.getMonth()};
    pop=document.createElement('div');pop.className='pop';pop.id='race-pop';
    app.appendChild(pop);drawPop();
    var r=btn.getBoundingClientRect();
    pop.style.left=Math.max(16,Math.min(r.left+window.scrollX,window.scrollX+document.documentElement.clientWidth-pop.offsetWidth-16))+'px';
    pop.style.top=(r.bottom+window.scrollY+8)+'px';
  }
  function drawPop(){
    if(!pop)return;
    var y=view.y,m=view.m,off=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate(),h='';
    for(var i=0;i<off;i++)h+='<span></span>';
    for(var d=1;d<=n;d++){var ds=ymd(new Date(y,m,d));h+='<button type="button" data-day="'+ds+'" class="'+(ds===state.race?'sel ':'')+(ds===TODAY?'today':'')+'">'+d+'</button>'}
    pop.innerHTML='<div class="pop-head"><button type="button" data-nav="-1" aria-label="‹">‹</button><b>'+t('mo')[m]+' '+y+'</b><button type="button" data-nav="1" aria-label="›">›</button></div>'+
      '<div class="grid7">'+t('dn').map(function(x){return '<span class="dn">'+x+'</span>'}).join('')+h+'</div>'+
      '<button type="button" class="inf'+(isDate(state.race)?'':' sel')+'" data-inf="1">'+t('inf')+'</button>';
  }

  document.addEventListener('click',function(e){
    var el=e.target.closest('button');
    if(pop&&!e.target.closest('#race-pop')&&!(el&&el.id==='race-btn'))closePop();
    if(!el)return;
    if(el.dataset.lang){state.lang=el.dataset.lang;set('lang',state.lang);renderAll();return}
    if(el.id==='theme'){state.theme=state.theme==='light'?'dark':'light';set('theme',state.theme);renderStatic();if(state.sec==='a')renderAna();return}
    if(el.dataset.d){var k=el.dataset.d,active=DISC.filter(function(d){return state.on[d[0]]}).length;
      if(state.on[k]&&active===1)return;state.on[k]=!state.on[k];renderChips();renderStats();return}
    if(el.id==='race-btn'){pop?closePop():openPop(el);return}
    if(el.dataset.nav){view.m+=+el.dataset.nav;if(view.m>11){view.m=0;view.y++}if(view.m<0){view.m=11;view.y--}drawPop();return}
    if(el.dataset.day){state.race=el.dataset.day;set('race',state.race);closePop();renderCount();return}
    if(el.dataset.inf){state.race='inf';set('race','inf');closePop();renderCount();return}
  });
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closePop()});

  renderAll();
})();
</script>
