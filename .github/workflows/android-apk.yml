# Costruisce l'APK Android firmato e lo pubblica nelle Release di GitHub.
# Si avvia a mano (Actions → Android APK → Run workflow) o con un tag `v*`.
# Segreti richiesti: SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, ANDROID_KEYSTORE_BASE64,
# ANDROID_KEYSTORE_PASSWORD.
# Gli errori finiscono anche nelle annotazioni del run (leggibili senza accesso ai log).
name: Android APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    # immagine con Android SDK già installato (ANDROID_HOME)
    runs-on: ubuntu-24.04
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Controllo dei segreti
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SU: ${{ secrets.SUPABASE_URL }}
          SK: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          for v in KS KP SU SK; do
            if [ -z "${!v}" ]; then echo "::error::Segreto mancante ($v): aggiungilo nei segreti del repository"; exit 1; fi
          done

      - run: npm ci

      - name: Build dell'app web
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          # numero di build: l'app lo confronta con l'ultima release per proporre l'aggiornamento
          VITE_APP_BUILD: ${{ github.run_number }}
        run: npm run build

      - run: npx cap sync android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Controllo della chiave di firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.p12"; then
            echo "::error::ANDROID_KEYSTORE_BASE64 non è un testo base64 valido"
            exit 1
          fi
          if ! keytool -list -storetype pkcs12 -keystore "$RUNNER_TEMP/release.p12" \
            -storepass "$(printf '%s' "$ANDROID_KEYSTORE_PASSWORD" | tr -d '[:space:]')" > /dev/null; then
            echo "::error::Chiave non leggibile: controlla ANDROID_KEYSTORE_PASSWORD e ANDROID_KEYSTORE_BASE64"
            exit 1
          fi

      - name: Build dell'APK firmato
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: mymasterpiece
        run: |
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.p12"
          export ANDROID_KEYSTORE_PASSWORD="$(printf '%s' "$ANDROID_KEYSTORE_PASSWORD" | tr -d '[:space:]')"
          echo "Android SDK: $ANDROID_HOME"
          cd android
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew assembleRelease --no-daemon 2>&1 | tee "$RUNNER_TEMP/gradle.log"; then
            python3 ../.github/scripts/gradle-error.py "$RUNNER_TEMP/gradle.log"
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/my-masterpiece.apk"

      - name: Pubblicazione nelle Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('apk-{0}', github.run_number) }}
          # "build N" nel nome: l'app lo legge per sapere se c'è una versione nuova
          name: ${{ github.ref_type == 'tag' && format('My Masterpiece {0} (build {1})', github.ref_name, github.run_number) || format('My Masterpiece build-{0}', github.run_number) }}
          make_latest: true
          files: ${{ runner.temp }}/my-masterpiece.apk
