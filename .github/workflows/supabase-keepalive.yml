# Tiene sveglio il progetto Supabase gratuito (va in pausa dopo 7 giorni senza attività):
# ogni 3 giorni una lettura sulla tabella `items` (con la RLS non restituisce dati).
# Segreti richiesti nel repository: SUPABASE_URL e SUPABASE_PUBLISHABLE_KEY.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Lettura sul database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Segreti SUPABASE_URL e SUPABASE_PUBLISHABLE_KEY non configurati."
            exit 1
          fi
          curl --fail --silent --show-error \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/rest/v1/items?select=id&limit=1"
